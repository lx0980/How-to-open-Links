<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Shorts</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
}

.reel{
    width:100%;
    height:100vh;
    scroll-snap-align:start;
}

.reel iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>

<div class="reel">
    <iframe src="https://www.youtube.com/embed/Ug6VA-xWrXA" allowfullscreen></iframe>
</div>

<div class="reel">
    <iframe src="https://www.youtube.com/embed/FxXX8fo_350" allowfullscreen></iframe>
</div>

<div class="reel">
    <iframe src="https://www.youtube.com/embed/_x5DBqp0Suw" allowfullscreen></iframe>
</div>

<div class="reel">
    <iframe src="https://www.youtube.com/embed/9-JqUp_ro-I" allowfullscreen></iframe>
</div>

</body>
</html>
